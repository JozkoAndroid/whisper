[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hlas"
version = "0.1.0"
description = "Push-to-talk dictation for Slovak, German and English (with mixing), plus an AI cleanup pass."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.6",      # Claude cleanup pass (brings httpx2, used for STT calls too)
    "numpy>=1.26",
]

[project.optional-dependencies]
# The desktop app (hotkey, microphone, tray, paste). Not needed to use hlas as a library or server.
app = [
    "sounddevice>=0.4.6",
    "pynput>=1.7.7",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "pillow>=10",
]
# Offline transcription with faster-whisper (large-v3). Slower and less accurate than the cloud models.
local = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
hlas = "hlas.cli:main"

[tool.setuptools]
packages = ["hlas"]
