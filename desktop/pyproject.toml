[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hlas"
version = "0.1.0"
description = "Free push-to-talk dictation for Slovak, German and English (with mixing)."
requires-python = ">=3.10"
dependencies = [
    "sherpa-onnx>=2.0",    # offline speech recognition (free, default)
    "numpy>=1.26",
    "anthropic>=2.6",      # optional paid Claude cleanup; also brings httpx2 used for HTTP calls
]

[project.optional-dependencies]
# The desktop app (hotkey, microphone, tray, paste). Not needed to use hlas as a library or server.
app = [
    "sounddevice>=0.4.6",
    "pynput>=1.7.7",
    "pyperclip>=1.8",
    "pystray>=0.19",
    "pillow>=10",
]
dev = ["pytest>=8"]

[project.scripts]
hlas = "hlas.cli:main"

[tool.setuptools]
packages = ["hlas"]
