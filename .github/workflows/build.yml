name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "./desktop[app,dev]" pyinstaller
      - name: Test
        run: python -m pytest -q desktop/tests
      - name: Build Hlas.exe
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Hlas
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          --collect-all sherpa_onnx
          hlas_app.py
      # Real Windows checks: download the models from the release, transcribe
      # recordings, then start Hlas.exe and confirm it loads them without errors.
      - name: Windows test - download models and transcribe
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $t = Get-Date
          python -m hlas models
          Write-Output "model download took $([int]((Get-Date) - $t).TotalSeconds) s"
          python -m hlas transcribe desktop/tests/data/sk2.wav --no-cleanup --json
          python -m hlas transcribe desktop/tests/data/mix4.wav --no-cleanup --json
      - name: Windows test - start Hlas.exe
        shell: pwsh
        run: |
          $p = Start-Process desktop/dist/Hlas.exe -PassThru
          $logPath = "$env:APPDATA/Hlas/hlas.log"
          for ($i = 0; $i -lt 40; $i++) {
            Start-Sleep 3
            if ($p.HasExited) { break }
            if ((Test-Path $logPath) -and ((Get-Content $logPath -Raw) -match "speech models ready")) { break }
          }
          $log = if (Test-Path $logPath) { Get-Content $logPath -Raw } else { "(no log file)" }
          Write-Output $log
          if ($p.HasExited) { throw "Hlas.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Get-Process Hlas -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($log -notmatch "hotkey listener started") { throw "hotkey listener did not start" }
          if ($log -notmatch "speech models ready") { throw "speech models did not load" }
          if ($log -match "ERROR|Traceback") { throw "errors in the log" }
      - uses: actions/upload-artifact@v4
        with:
          name: Hlas-windows
          path: desktop/dist/Hlas.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Build APK
        working-directory: android
        # retry: downloading Gradle/dependencies occasionally fails on GitHub's network
        run: |
          for i in 1 2 3 4 5 6; do
            ./gradlew --no-daemon testDebugUnitTest assembleRelease && exit 0
            sleep $((i * 30))
          done
          exit 1
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Hlas-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hlas-android
          path: Hlas-android.apk

  # Publish the newest apps at fixed links:
  #   https://github.com/<owner>/<repo>/releases/download/app-latest/Hlas.exe
  #   https://github.com/<owner>/<repo>/releases/download/app-latest/Hlas-android.apk
  publish:
    # publish whatever built, even if one platform failed
    if: always() && github.event_name == 'push' && (needs.windows.result == 'success' || needs.android.result == 'success')
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the app-latest release
        run: |
          TAG=app-latest
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hlas apps ($TAG)" \
              --notes "Download Hlas.exe (Windows) or Hlas-android.apk (Android). Updated on every change."
          ls -la dist
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
