name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "./desktop[app,dev]" pyinstaller
      - name: Test
        run: python -m pytest -q desktop/tests
      - name: Build Hlas.exe
        working-directory: desktop
        run: >
          pyinstaller --noconfirm --onefile --windowed --name Hlas
          --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32
          --hidden-import pystray._win32
          --collect-all sherpa_onnx
          hlas_app.py
      - uses: actions/upload-artifact@v4
        with:
          name: Hlas-windows
          path: desktop/dist/Hlas.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build APK
        working-directory: android
        # retry: downloading Gradle/dependencies occasionally fails on GitHub's network
        run: |
          for i in 1 2 3; do
            ./gradlew --no-daemon testDebugUnitTest assembleRelease && exit 0
            sleep 30
          done
          exit 1
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Hlas-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hlas-android
          path: Hlas-android.apk

  # Publish the newest apps at fixed links:
  #   https://github.com/<owner>/<repo>/releases/download/app-latest/Hlas.exe
  #   https://github.com/<owner>/<repo>/releases/download/app-latest/Hlas-android.apk
  publish:
    if: github.event_name == 'push'
    needs: [windows, android]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Update the app-latest release
        run: |
          TAG=app-latest
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF#refs/tags/}"; fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Hlas apps ($TAG)" \
              --notes "Download Hlas.exe (Windows) or Hlas-android.apk (Android). Updated on every change."
          gh release upload "$TAG" dist/Hlas.exe dist/Hlas-android.apk --repo "$GITHUB_REPOSITORY" --clobber
